name: Source checks
on:
  push:
  pull_request:

jobs:
  source:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: node --check main.js
      - run: node --check src/services/windows-loopback-audio.service.js
      - run: python -m py_compile src/native/whisper_streaming_worker.py src/native/windows_loopback_worker.py
      - name: Build Windows installers
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish never
      - name: Save Windows installers
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: OpenCluely-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
