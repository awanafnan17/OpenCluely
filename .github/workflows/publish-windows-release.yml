name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful workflow run containing OpenCluely-Windows
        required: true
        type: string
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows installers
        uses: actions/download-artifact@v4
        with:
          name: OpenCluely-Windows
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize asset filenames
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f -name '* *' -print0 |
            while IFS= read -r -d '' file; do
              mv "$file" "${file// /-}"
            done

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
